<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800;900&family=Overpass+Mono:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Squoosh bulk convert</title><meta name="theme-color" content="#FFD400"></head>
<body class="bulk">
<div class="page">
  <header class="bhead on-black">
    <a class="btn btn--white" href="index.html"><svg class="i"><use href="#i-arrow-left"/></svg>Back</a>
    <div><h1>Bulk convert</h1><p class="meta" id="meta">12 images · <span class="flap" data-flap="7">7</span> converted</p></div>
    <div class="views" role="group" aria-label="Layout">
      <button class="ibtn" id="v-list" aria-pressed="true" aria-label="List view" title="List"><svg class="i"><use href="#i-list"/></svg></button>
      <button class="ibtn" id="v-grid" aria-pressed="false" aria-label="Thumbnail grid view" title="Thumbnail grid"><svg class="i"><use href="#i-grid"/></svg></button>
    </div>
  </header>

  <main class="bwrap" id="bwrap">
    <section class="boardwrap" aria-label="Images">
      <div class="cols-h" aria-hidden="true"><span></span><span>Image</span><span>Original</span><span>Status</span><span>Result</span></div>
      <ul class="board" id="board"></ul>
      <div class="bfoot on-black">
        <div class="pg"><span id="pg-t">7 of 12 converted</span></div>
        <div class="prog" role="progressbar" aria-label="Conversion progress" aria-valuemin="0" aria-valuemax="12" aria-valuenow="7" id="prog"><i></i></div>
        <div class="tot" id="tot"></div>
        <div class="acts">
          <button class="btn btn--yellow" id="convert"><svg class="i"><use href="#i-arrow-right"/></svg><span>Convert all</span></button>
          <button class="btn btn--ghost" id="zip"><svg class="i"><use href="#i-download"/></svg><span>Download all (ZIP)</span></button>
        </div>
      </div>
    </section>
    <aside class="sideconsole on-black" aria-label="Shared options">
      <h2>Options</h2><p>Applied to every image.</p>
      <div id="opts" data-side="s"></div>
    </aside>
  </main>
</div>
<dialog class="cmp" id="cmp" aria-label="Compare image"><div class="cmp-in" id="cmp-in"></div></dialog>
<div class="snack" id="snack" role="status" aria-live="polite" hidden><span id="snack-t"></span></div>
<script src="app.js"></script>
</body></html>
